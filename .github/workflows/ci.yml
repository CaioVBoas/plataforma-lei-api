name: CI - Plataforma LEI API

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validate-and-test:
    name: Lint, Test & Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plataforma_lei_db?schema=public
        run: npx prisma generate

      - name: Run ESLint & Prettier check
        run: npm run lint:check

      - name: Run Unit Tests
        run: npm test

      - name: Build NestJS application
        run: npm run build

      - name: Validate Docker image build
        run: docker build -t plataforma-lei-api:ci .
